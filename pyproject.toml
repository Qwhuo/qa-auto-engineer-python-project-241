[project]
name = "hexlet-code"
version = "0.1.0"
description = "Tool for comparing two files"
readme = "README.md"
authors = [
    { name = "Polina Maksimovna", email = "polina.trofimova@icloud.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pytest>=9.1.1",
]

[project.scripts]
gendiff = "gendiff.scripts.gendiff_entry:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gendiff"]


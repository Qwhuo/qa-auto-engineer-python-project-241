[project]
name = "hexlet-code"
version = "0.1.0"
description = "Tool for comparing two files"
readme = "README.md"
authors = [
    { name = "Polina Maksimovna", email = "polina.trofimova@icloud.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-coverage>=0.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.3",
]

[project.scripts]
gendiff = "gendiff.scripts.gendiff_entry:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gendiff"]

[tool.coverage.report]
fail_under = 80

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]


name: Project CI
on:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check repo
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install uv
        uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: make install
      - name: Run test
        run: make check
      - name: Check test-coverage
        run: make test-coverage
      - name: Build package
        run: make build